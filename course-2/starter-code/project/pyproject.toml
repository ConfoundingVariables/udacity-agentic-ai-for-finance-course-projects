[project]
name = "swift-workflow"
version = "0.1.0"
description = "Multi-agent SWIFT transaction processing system (evaluator-optimizer, parallelization, prompt chaining, orchestrator-worker)"
requires-python = ">=3.11"
dependencies = [
    "faker>=37.5.3",
    "numpy>=2.3.2",
    "openai>=1.99.5",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "scipy>=1.16.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
