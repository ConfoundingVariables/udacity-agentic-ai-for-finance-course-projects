# Agent configuration: models, providers, prompts, tool descriptions and analysis thresholds.
# Edit here instead of in code.

[models]
# Providers are tried in order; the first whose key is set and answers a 1-token probe is used.
provider_order = ["vocareum", "openrouter"]
temperature = 0
context_window = 16385
# Starting chunks per embedding request; halved automatically if a provider rejects the batch as too large.
embed_batch_size = 100
# Concurrent embedding requests per document while building an index.
embed_workers = 8

[providers.vocareum]
api_base_env = "OPENAI_API_BASE"
default_api_base = "https://openai.vocareum.com/v1"
api_key_env = "OPENAI_API_KEY"
llm = "gpt-3.5-turbo"
embedding = "text-embedding-ada-002"

[providers.openrouter]
default_api_base = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
llm = "openai/gpt-3.5-turbo"
# openai/text-embedding-ada-002 needs a valid OpenAI BYOK key on the OpenRouter account
embedding = "mistralai/mistral-embed-2312"

# USD per 1M tokens, used for cost estimates in monitoring.
[pricing]
llm_input = 0.50
llm_output = 1.50
embedding = 0.10

[documents]
chunk_size = 1024
chunk_overlap = 100
similarity_top_k = 3

[routing]
guidelines = """
- Customers, portfolios, holdings, accounts, investment profiles -> database_query_tool
- Current/real-time stock price, change, trading volume -> finance_market_search_tool
- A company's business, products, segments, risk factors or revenue from its 10-K -> that company's *_10k_filing_tool
- Trend, volatility, returns, moving averages, drawdown of a stock -> financial_analysis_tool
- Profit/loss, allocation, concentration or risk fit of customer portfolios -> portfolio_analysis_tool
- Questions spanning several of these need several tools.
"""
# Below this routing confidence the coordinator flags the answer as low confidence.
low_confidence_threshold = 0.6

# Few-shot examples shown to the router (and the seed set for DSPy optimization).
[[routing.examples]]
query = "What does Tesla say about competition in its annual report?"
tools = ["TSLA_10k_filing_tool"]

[[routing.examples]]
query = "Which customers have an aggressive investment profile?"
tools = ["database_query_tool"]

[[routing.examples]]
query = "How is Google stock trading right now?"
tools = ["finance_market_search_tool"]

[[routing.examples]]
query = "How volatile has Apple stock been recently?"
tools = ["financial_analysis_tool"]

[[routing.examples]]
query = "Which customers are sitting on losses and is anyone over-concentrated?"
tools = ["portfolio_analysis_tool"]

[[routing.examples]]
query = "Summarize Apple's main risks and show its current share price"
tools = ["AAPL_10k_filing_tool", "finance_market_search_tool"]

[tools]
document = "Answers questions about {name} ({symbol}) from its 2024 SEC 10-K filing: business segments, products, revenue drivers, risk factors, competition and financial disclosures."
database_query_tool = "Query the customer and portfolio database in natural language: customers, holdings, account balances, investment profiles, company records."
finance_market_search_tool = "Real-time stock price, change and trading volume for Apple (AAPL), Google (GOOGL) and Tesla (TSLA) from Yahoo Finance."
pii_protection_tool = "Mask personal data (names, emails, phones, addresses, SSNs) in database results."
financial_analysis_tool = "Technical analysis of AAPL, GOOGL or TSLA price history: period return, annualized volatility, 20/50-day moving averages and trend, max drawdown."
portfolio_analysis_tool = "Customer portfolio analytics at live prices: cost basis, market value, unrealized P&L, allocation weights, concentration and fit with the customer's risk tolerance. Reports customer ids only (no PII)."

# Prompt templates ({placeholders} are filled in code). XML tags separate instructions from data.
[prompts]
document_qa = """<role>You are an equity research analyst answering from {company}'s 2024 SEC Form 10-K.</role>
<excerpts>
{context_str}
</excerpts>
<rules>
- Use only facts stated in the excerpts. Never guess and never write "likely" or "may include".
- Prefer concrete names, segment names and figures exactly as written in the excerpts.
- If the excerpts do not answer the question, say "The retrieved 10-K excerpts do not cover this." and stop.
</rules>
<format>Two to five short bullet points, most important first.</format>
<question>{query_str}</question>"""

sql = """<task>Write one SQLite SELECT statement that answers the question.</task>
<schema>
{schema}
</schema>
<rules>
- Use only tables and columns in the schema.
- Price paid per share is portfolio_holdings.purchase_price; total cost is shares * purchase_price.
- For the latest market price use the most recent market_data row per symbol.
- Include customers.id whenever customers are listed.
- Return only the SQL: no markdown, no comments, no explanation.
</rules>
{error}<question>{query}</question>"""

sql_retry = """<previous_error>{error}</previous_error>
"""

synthesis = """<role>You are a financial analyst writing for a portfolio manager.</role>
<question>{query}</question>
<sources>
{sources}
</sources>
<rules>
- Use only facts in the sources. Do not invent numbers, names or segments.
- Never write placeholders such as [segments] or [data]. If a source lacks something, say which source and what is missing.
- Keep masked values (****, ***@domain) masked.
- Label per-share prices and total amounts explicitly; never compare a total cost with a per-share price.
</rules>
<format>
1. One-sentence direct answer.
2. Supporting points grouped under each source name.
3. Data gaps or conflicts (omit if none).
</format>"""

[analysis]
history_range = "6mo"
# Largest single-position weight considered acceptable for each risk tolerance.
max_position_weight = { low = 0.40, medium = 0.60, high = 0.85 }
